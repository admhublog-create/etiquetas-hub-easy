<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17365d" />
  <title>Insumos HUB Easy</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app"></div>
  <script src="/visual.js"></script>
  <script type="module">
    const path=location.pathname.replace(/\/+$/,'')||'/';
    if(path==='/admin') {
      import('/admin-v2.js');
      import('/historico.js');
      import('/fita.js');
    } else if(path==='/retirar/fita-gomada') {
      import('/fita.js');
    } else {
      import('/app.js');
      import('/fita.js');
    }
  </script>
</body>
</html>
